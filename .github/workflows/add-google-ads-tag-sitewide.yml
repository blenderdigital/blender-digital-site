name: Add Google Ads tag sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-google-ads-tag-sitewide.yml'

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Google Ads destination to existing GA4 tags
        shell: python
        run: |
          from pathlib import Path

          ga_line = "gtag('config', 'G-JEJPG0H4HC');"
          ads_line = "gtag('config', 'AW-18345428557');"
          updated = []
          already_present = []
          no_ga_tag = []

          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if ads_line in text:
                  already_present.append(str(path))
                  continue
              if ga_line not in text:
                  no_ga_tag.append(str(path))
                  continue

              lines = text.splitlines(keepends=True)
              new_lines = []
              inserted = False
              for line in lines:
                  new_lines.append(line)
                  if not inserted and ga_line in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      newline = '\r\n' if line.endswith('\r\n') else '\n'
                      new_lines.append(f"{indent}{ads_line}{newline}")
                      inserted = True

              path.write_text(''.join(new_lines), encoding='utf-8')
              updated.append(str(path))

          print(f'Updated {len(updated)} HTML files:')
          for item in updated:
              print(f'  + {item}')
          print(f'Already configured: {len(already_present)}')
          for item in already_present:
              print(f'  = {item}')
          print(f'No existing GA4 tag found: {len(no_ga_tag)}')
          for item in no_ga_tag:
              print(f'  - {item}')

      - name: Remove temporary workflow
        run: rm -f .github/workflows/add-google-ads-tag-sitewide.yml

      - name: Commit sitewide tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Google Ads destination across marketing site"
          git push origin main
