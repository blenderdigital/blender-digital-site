name: Ensure Microsoft Clarity is on every page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-clarity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Clarity to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_id = "xw6minc8wz"
          snippet = '''  <!-- Microsoft Clarity -->
          <script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "xw6minc8wz");
          </script>
          '''

          updated = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if project_id in text:
                  continue
              if '<head>' not in text:
                  print(f'Skipped {path}: no <head> element')
                  continue
              text = text.replace('<head>', '<head>\n' + snippet, 1)
              path.write_text(text, encoding='utf-8')
              updated.append(str(path))

          print(f'Updated {len(updated)} HTML files')
          for path in updated:
              print(f'  - {path}')
          PY

      - name: Commit updated pages
        run: |
          if git diff --quiet; then
            echo "Clarity is already present on every HTML page."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Add Microsoft Clarity to all HTML pages"
          git push
