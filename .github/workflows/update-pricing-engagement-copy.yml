name: Update pricing engagement copy

on:
  push:
    paths:
      - '.github/workflows/update-pricing-engagement-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the pricing section subcopy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Simple retainers. Clear scope. Month-to-month (with a minimum 6-mo. term).'
          new = 'Simple pricing. Clear scope. Choose a focused 4- or 6-month engagement—designed to deliver measurable ROI without an ongoing retainer.'

          if new in text and old not in text:
              print('Pricing copy is already updated.')
          else:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one matching pricing sentence; found {text.count(old)}.')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/update-pricing-engagement-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update pricing engagement copy'
          git push
