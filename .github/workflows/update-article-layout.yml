name: Update article layout

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_article_layout.py"
      - ".github/workflows/update-article-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update all article layouts
        run: python scripts/update_article_layout.py

      - name: Commit generated article updates
        run: |
          if git diff --quiet; then
            echo "No article changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          git commit -m "Widen article layouts and separate related resources"
          git push
