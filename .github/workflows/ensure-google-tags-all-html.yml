name: Ensure Google tags on every HTML page

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ensure-google-tags-all-html.yml

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add complete Google tag to HTML pages missing GA4
        shell: python
        run: |
          from pathlib import Path
          import re

          ga_id = "G-JEJPG0H4HC"
          ads_id = "AW-18345428557"
          full_tag = """  <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-JEJPG0H4HC"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-JEJPG0H4HC');
            gtag('config', 'AW-18345428557');
          </script>
          """

          changed = []
          complete = []

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              if ga_id in text and ads_id in text:
                  complete.append(str(path))
                  continue
              if ga_id in text and ads_id not in text:
                  raise RuntimeError(f"GA4 exists without Ads destination in {path}")
              head = re.search(r"<head(?:\s[^>]*)?>", text, flags=re.IGNORECASE)
              if not head:
                  raise RuntimeError(f"No head tag found in {path}")
              text = text[:head.end()] + "\n" + full_tag + text[head.end():]
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("Added full Google tag to:")
          for item in changed:
              print("  +", item)
          print("Already complete:", len(complete))

      - name: Remove temporary workflow
        run: rm -f .github/workflows/ensure-google-tags-all-html.yml

      - name: Commit complete sitewide tag coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Ensure Google Analytics and Ads tags on every HTML page"
          git push origin main
