name: Publish Blender legal pages

on:
  push:
    paths:
      - '.github/workflows/publish-legal-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create legal pages and update homepage footer
        shell: python
        run: |
          import base64
          from pathlib import Path

          terms = base64.b64decode(" ").decode("utf-8")
          privacy = base64.b64decode(" ").decode("utf-8")
          Path("terms-of-service.html").write_text(terms, encoding="utf-8")
          Path("privacy-policy.html").write_text(privacy, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          old = '<div class="small" style="text-align:center;width:100%">© 2026 Blender Digital</div>'
          new = '''<div class="small">© 2026 Blender Digital LLC</div><div class="small" style="display:flex;gap:18px;flex-wrap:wrap"><a href="/terms-of-service">Terms of Service</a><a href="/privacy-policy">Privacy Policy</a><a href="/privacy-policy?tab=fulfillment">Fulfillment Policy</a></div>'''
          if old not in index:
              raise SystemExit("Homepage footer copyright block was not found; no changes made.")
          index = index.replace(old, new, 1)
          index_path.write_text(index, encoding="utf-8")

          sitemap_path = Path("sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          additions = '''  <url><loc>https://www.blenderdigital.co/terms-of-service</loc></url>
  <url><loc>https://www.blenderdigital.co/privacy-policy</loc></url>
'''
          if "https://www.blenderdigital.co/terms-of-service" not in sitemap:
              sitemap = sitemap.replace("</urlset>", additions + "\n</urlset>")
              sitemap_path.write_text(sitemap, encoding="utf-8")

          Path(".github/workflows/publish-legal-pages.yml").unlink()
      - name: Commit published legal pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml terms-of-service.html privacy-policy.html .github/workflows/publish-legal-pages.yml
          git commit -m "Publish Blender legal policies and homepage links"
          git push
