name: Update FAQ 3 copy
on:
  push:
    paths:
      - '.github/workflows/update-faq-3-copy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FAQ answer and schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_html = 'Many restaurants begin seeing measurable changes within 30 to 60 days, especially when there are clear opportunities involving promotions, menu organization, Sponsored Listings, or storefront quality. More substantial growth usually requires consistent optimization over several months.'
          new_html = 'Many restaurants begin seeing measurable changes within <strong>30 to 60 days</strong>, especially when there are clear opportunities involving promotions, menu organization, sponsored listings, or storefront quality. More substantial growth usually requires consistent optimization over several months.'
          old_schema = 'Many restaurants begin seeing measurable changes within 30 to 60 days, although the timeline depends on current sales, competition, ratings, pricing, operations, and promotional budget.'
          new_schema = 'Many restaurants begin seeing measurable changes within 30 to 60 days, especially when there are clear opportunities involving promotions, menu organization, sponsored listings, or storefront quality. More substantial growth usually requires consistent optimization over several months.'
          if old_html not in s:
              raise SystemExit('Visible FAQ text not found')
          s = s.replace(old_html, new_html, 1)
          if old_schema in s:
              s = s.replace(old_schema, new_schema, 1)
          p.write_text(s)
          PY
          rm .github/workflows/update-faq-3-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-faq-3-copy.yml
          git commit -m "Update third homepage FAQ answer"
          git push
