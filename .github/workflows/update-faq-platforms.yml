name: Update FAQ platforms
on:
  push:
    paths:
      - '.github/workflows/update-faq-platforms.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FAQ answer and schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_visible = 'We primarily manage DoorDash, Uber Eats, Grubhub, Toast, direct online ordering systems, and catering platforms such as ezCater when applicable. The exact strategy depends on where your restaurant currently sells and where the strongest growth opportunities exist.'
          new_visible = 'We primarily manage <strong>DoorDash</strong>, <strong>Uber Eats</strong>, <strong>Grubhub</strong>, <strong>Toast</strong>, direct online ordering systems (<strong>Square</strong>, <strong>Clover</strong>), and catering platforms such as <strong>ezCater</strong> when applicable. The exact strategy depends on where your restaurant currently sells and where the strongest growth opportunities exist.'
          old_schema = 'Blender Digital primarily manages DoorDash, Uber Eats, Grubhub, Toast, direct online ordering systems, and catering platforms such as ezCater when applicable.'
          new_schema = 'Blender Digital primarily manages DoorDash, Uber Eats, Grubhub, Toast, direct online ordering systems such as Square and Clover, and catering platforms such as ezCater when applicable.'
          if old_visible not in s:
              raise SystemExit('Visible FAQ text not found')
          if old_schema not in s:
              raise SystemExit('FAQ schema text not found')
          s = s.replace(old_visible, new_visible, 1)
          s = s.replace(old_schema, new_schema, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update FAQ platform list" || exit 0
          git push
